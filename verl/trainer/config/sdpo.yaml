# SDPO (Self-Distilled Policy Optimization) preset for Search-R1 + search.
# Usage: python3 -m verl.trainer.main_ppo --config-name sdpo
defaults:
  - ppo_trainer
  - _self_

data:
  return_raw_chat: true

actor_rollout_ref:
  actor:
    policy_loss:
      loss_mode: sdpo
    self_distillation:
      max_reprompt_len: 10240
      is_clip: 2.0
      teacher_regularization: actor
      full_logit_distillation: false
      alpha: 1.0
    optim:
      lr: 1e-6
  ref:
    fsdp_config:
      param_offload: true
  rollout:
    n: 4

algorithm:
  adv_estimator: grpo

trainer:
  val_before_train: false
