# Online rejection-SFT (NLL on EM-correct search rollouts) with FIFO replay buffer.
# Usage: python3 -m verl.trainer.main_ppo --config-name sft_correct
defaults:
  - ppo_trainer
  - _self_

actor_rollout_ref:
  actor:
    policy_loss:
      loss_mode: sft
    sft:
      success_reward_threshold: 0.5
      replay_buffer_capacity: 4096
      replay_samples_per_step: 256
    calculate_entropy: true
    optim:
      lr: 1e-6
  rollout:
    n: 4

algorithm:
  adv_estimator: grpo

trainer:
  val_before_train: false
