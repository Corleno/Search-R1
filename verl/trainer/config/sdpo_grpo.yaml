# SDPO+GRPO hybrid preset: sum of self-distillation loss and GRPO clipped policy loss.
# Usage: python3 -m verl.trainer.main_ppo --config-name sdpo_grpo
defaults:
  - ppo_trainer
  - _self_

data:
  return_raw_chat: true

actor_rollout_ref:
  actor:
    policy_loss:
      loss_mode: sdpo_grpo
      sdpo_coef: 1.0
      grpo_coef: 1.0
    self_distillation:
      filter_reprompt_before_update: false
      max_reprompt_len: 10240
      ppo_clip: true
      teacher_regularization: actor
      full_logit_distillation: false
      alpha: 1.0
    use_kl_loss: true
    kl_loss_coef: 0.001
    kl_loss_type: low_var_kl
    optim:
      lr: 1e-6
  ref:
    fsdp_config:
      param_offload: true
  rollout:
    n: 4

algorithm:
  adv_estimator: grpo

trainer:
  val_before_train: false
